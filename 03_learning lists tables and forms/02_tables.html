<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables - HTML</title>
    <link rel="stylesheet" href="02_tables.css" />
  </head>
  <body>
    <header>
      <h1>These are my Academic Marksheets</h1>
    </header>
    <main>
      <table>
        <caption>
          10th Marks
        </caption>
        <thead>
          <tr>
            <th>Bengali</th>
            <th>English</th>
            <th>Mathematics</th>
            <th>Physical Science</th>
            <th>Life Science</th>
            <th>Geography</th>
            <th>History</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>86</td>
            <td>77</td>
            <td>98</td>
            <td>91</td>
            <td>97</td>
            <td>98</td>
            <td>85</td>
          </tr>
        </tbody>
      </table>
      <table>
        <caption>
          12th Marks
        </caption>
        <thead>
          <tr>
            <th>Bengali</th>
            <th>English</th>
            <th>Mathematics</th>
            <th>Physics</th>
            <th>Chemistry</th>
            <th>Life Science</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>90</td>
            <td>94</td>
            <td>66</td>
            <td>71</td>
            <td>71</td>
            <td>76</td>
          </tr>
          <tr>
            <td colspan="6">Thank You</td>
          </tr>
        </tbody>
      </table>
    </main>
    <footer>Thank You for visiting my Webpage</footer>
  </body>
</html>
