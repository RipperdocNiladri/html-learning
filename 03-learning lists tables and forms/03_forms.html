<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML-Forms</title>
    <link rel="stylesheet" href="03_forms.css" />
  </head>
  <body>
    <form action="/submit.php">
      <!-- Text input for Name -->
      <div>
        <label for="name">Name:</label>
        <input id="name" type="text" placeholder="Enter Name" required />
      </div>

      <!-- Phone input -->
      <div>
        <label for="ph1">Phone 1:</label>
        <input
          id="ph1"
          name="phone1"
          type="tel"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          placeholder="Enter Phone 1"
          required
        />
      </div>
      <div>
        <label for="ph2">Phone 2:</label>
        <input
          id="ph2"
          name="phone2"
          type="tel"
          pattern="[0-9]{10}"
          placeholder="Enter Phone 2"
          required
        />
      </div>

      <!-- Email input -->
      <div>
        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="Enter Email" required />
      </div>

      <!-- Password input -->
      <div>
        <label for="password">Password:</label>
        <input
          id="password"
          type="password"
          placeholder="Enter Password"
          required
        />
      </div>

      <!-- Date input -->
      <div>
        <label for="dob">Date of Birth:</label>
        <input id="dob" type="date" required />
      </div>

      <!-- Dropdown (select input) for Gender -->
      <div>
        <label for="gender">Gender:</label>
        <select id="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Radio buttons -->
      <div>
        <p>Subscription Plan</p>
        <input id="basic" type="radio" name="subscription" value="basic" />
        <label for="basic">Basic</label>

        <input id="super" type="radio" name="subscription" value="super" />
        <label for="super">Super</label>

        <input id="premium" type="radio" name="subscription" value="premium" />
        <label for="premium">Premium</label>
      </div>

      <!-- Checkbox for agreeing to terms -->
      <div>
        <input id="terms" type="checkbox" required />
        <label for="terms">I agree to the terms and conditions</label>
      </div>

      <!-- Textarea for comments -->
      <div>
        <label for="comments">Comments</label>
        <textarea
          id="comments"
          placeholder="Enter your comments"
          rows="4"
        ></textarea>
      </div>

      <!-- Submit button -->
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
